# SonarCloud automatic-analysis settings.
# The check scripts run on CI's Ubuntu Python and on contributors' machines
# through the pre-commit hooks, where macOS still ships Python 3.9 — hence
# `from __future__ import annotations` in the scripts. Declaring the range
# makes Sonar flag any syntax that would break the oldest supported version.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13
